{% extends "base.html" %}
{% block title %}Upload Resume — SmartHire AI{% endblock %}
{% block content %}
<div class="container my-4">
  <div class="card sh-card p-4" style="max-width:600px;margin:0 auto;">
    <h4 class="fw-bold mb-1"><i class="bi bi-upload text-primary"></i> Upload Your Resume</h4>
    <p class="text-muted mb-4">PDF only, up to 5MB. Our AI will analyze it instantly.</p>
    <form method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="resumeInput" class="form-label d-block">
          <div class="border border-2 border-dashed rounded-3 text-center p-4" style="cursor:pointer;">
            <i class="bi bi-file-earmark-pdf fs-1 text-danger"></i>
            <p class="mb-0 mt-2" id="resumeFileName">Click to choose a PDF file</p>
          </div>
        </label>
        <input type="file" id="resumeInput" name="resume" accept=".pdf" class="d-none" required>
      </div>
      <button type="submit" class="btn btn-primary w-100"><i class="bi bi-cpu"></i> Analyze Resume</button>
    </form>
  </div>
</div>
{% endblock %}
