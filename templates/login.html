{% extends "base.html" %}
{% block title %}Login — SmartHire AI{% endblock %}
{% block content %}
<div class="card sh-card auth-card p-4">
  <h3 class="fw-bold text-center mb-1"><i class="bi bi-box-arrow-in-right text-primary"></i> Candidate Login</h3>
  <p class="text-muted text-center mb-4">Welcome back! Please login to continue</p>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-control" name="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Login</button>
  </form>
  <p class="text-center mt-3 mb-0 small">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  <p class="text-center mt-1 small">Recruiter? <a href="{{ url_for('auth.recruiter_login') }}">Login here</a></p>
  <p class="text-center mt-2 small text-muted">Admin demo login: admin@smarthire.ai / Admin@123</p>
</div>
{% endblock %}
