{% extends "base.html" %}
{% block title %}Candidate Register — SmartHire AI{% endblock %}
{% block content %}
<div class="card sh-card auth-card p-4">
  <h3 class="fw-bold text-center mb-1"><i class="bi bi-person-plus text-primary"></i> Candidate Registration</h3>
  <p class="text-muted text-center mb-4">Create your account to start applying for jobs</p>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input type="text" class="form-control" name="fullname" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-control" name="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Register</button>
  </form>
  <p class="text-center mt-3 mb-0 small">Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
  <p class="text-center mt-1 small">Are you a recruiter? <a href="{{ url_for('auth.recruiter_register') }}">Register as Recruiter</a></p>
</div>
{% endblock %}
