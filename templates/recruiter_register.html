{% extends "base.html" %}
{% block title %}Recruiter Register — SmartHire AI{% endblock %}
{% block content %}
<div class="card sh-card auth-card p-4">
  <h3 class="fw-bold text-center mb-1"><i class="bi bi-briefcase text-primary"></i> Recruiter Registration</h3>
  <p class="text-muted text-center mb-4">Create a company account to start posting jobs</p>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Company Name</label>
      <input type="text" class="form-control" name="company_name" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Contact Person</label>
      <input type="text" class="form-control" name="contact_person">
    </div>
    <div class="mb-3">
      <label class="form-label">Industry</label>
      <input type="text" class="form-control" name="industry" placeholder="e.g. IT Services">
    </div>
    <div class="mb-3">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-control" name="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Register</button>
  </form>
  <p class="text-center mt-3 mb-0 small">Already registered? <a href="{{ url_for('auth.recruiter_login') }}">Login here</a></p>
</div>
{% endblock %}
