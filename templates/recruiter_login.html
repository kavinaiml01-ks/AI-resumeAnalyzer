{% extends "base.html" %}
{% block title %}Recruiter Login — SmartHire AI{% endblock %}
{% block content %}
<div class="card sh-card auth-card p-4">
  <h3 class="fw-bold text-center mb-1"><i class="bi bi-briefcase text-primary"></i> Recruiter Login</h3>
  <p class="text-muted text-center mb-4">Access your company dashboard</p>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-control" name="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Login</button>
  </form>
  <p class="text-center mt-3 mb-0 small">New company? <a href="{{ url_for('auth.recruiter_register') }}">Register here</a></p>
</div>
{% endblock %}
